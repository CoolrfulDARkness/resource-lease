<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Resource lease">
  <title>Resource lease</title>
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="rl-shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#rl-bg)"/>

  <!-- shackle: an open arch, drawn as a stroked path -->
  <path d="M23 29v-5a9 9 0 0 1 18 0v5" fill="none" stroke="url(#rl-shackle)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- lock body -->
  <rect x="16" y="28" width="32" height="23" rx="6" fill="#e8eefc"/>

  <!-- keyhole -->
  <circle cx="32" cy="37" r="3.1" fill="#16203a"/>
  <path d="M32 38.4l2.2 6.4h-4.4z" fill="#16203a"/>

  <!-- two slots, the pool metaphor -->
  <circle cx="10" cy="52" r="2.6" fill="#38bdf8" opacity="0.85"/>
  <circle cx="19" cy="52" r="2.6" fill="#38bdf8" opacity="0.5"/>
</svg>
